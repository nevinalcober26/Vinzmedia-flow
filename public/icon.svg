<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background vibrant gradient -->
    <linearGradient id="vf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>

    <!-- Subtle inner surface light -->
    <linearGradient id="inner-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft drop shadow for floating depth -->
    <filter id="badge-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#312e81" flood-opacity="0.45" />
    </filter>

    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Modern Squircle Base -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="112"
    fill="url(#vf-grad)"
    filter="url(#badge-shadow)"
  />

  <!-- Subtle Inner Specular Border -->
  <rect
    x="34"
    y="34"
    width="444"
    height="444"
    rx="110"
    fill="none"
    stroke="url(#inner-light)"
    stroke-width="4"
  />

  <!-- Monogram Logo "VF" with clean bold geometry -->
  <g filter="url(#text-shadow)" fill="#ffffff">
    <text
      x="256"
      y="336"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="220"
      font-weight="900"
      letter-spacing="-6"
      text-anchor="middle"
      fill="#ffffff"
    >VF</text>
  </g>

  <!-- Modern Tech Sparkle Accent -->
  <circle cx="388" cy="128" r="14" fill="#38bdf8" />
  <circle cx="388" cy="128" r="7" fill="#ffffff" />
</svg>
